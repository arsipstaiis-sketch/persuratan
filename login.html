<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sistem Penomoran STAIIS</title>
    
    <!-- Font Modern dari Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Memanggil CSS khusus Login -->
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- Latar belakang aksen melengkung di kanan atas -->
    <div class="bg-accent-top-right"></div>

    <div class="login-wrapper">
        <!-- Panel Kiri (Hijau) -->
        <div class="login-left">
            <h1 class="login-title">Layanan<br>Administrasi<br>Persuratan</h1>
            
            <p class="login-desc">
                Aplikasi generate nomor surat resmi dan arsip dokumen persuratan digital.
            </p>
        </div>

        <!-- Panel Kanan (Formulir) -->
        <div class="login-right">
            <!-- Logo Instansi -->
            <div class="logo-container">
                <img src="logo.png" alt="Logo STAIIS" class="login-logo">
            </div>

            <form id="formLogin">
                <div class="form-group">
                    <input type="text" id="username" class="form-control" placeholder="Username" required>
                </div>
                
                <div class="form-group password-group">
                    <input type="password" id="password" class="form-control" placeholder="Password" required>
                    <span class="eye-icon" onclick="togglePassword()">
                        <i class="bi bi-eye-slash" id="eyeIcon"></i>
                    </span>
                </div>

                <button type="submit" class="btn-login-submit">LOGIN APLIKASI</button>
            </form>

            <div class="login-footer">
                <span>APLIKASI: <strong>PENOMORAN STAIIS v1.0</strong></span>
                <span>Copyright: arsip.staiis_2026</span>
            </div>
        </div>
    </div>

    <script>
        // Gunakan URL API Web App Google Apps Script Anda yang sama
        const urlAPI = "https://script.google.com/macros/s/AKfycbyKRnIKopECo_pADMEP_Cw5soGivDREjgO_2TtmaJkbA2Ru-7mDz6bSlimcVi7FPLh_HQ/exec";

        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                eyeIcon.classList.replace("bi-eye-slash", "bi-eye");
            } else {
                pwdInput.type = "password";
                eyeIcon.classList.replace("bi-eye", "bi-eye-slash");
            }
        }

        // Pengecekan Login Terhubung ke Google Apps Script
        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.querySelector('.btn-login-submit');
            const originalText = submitBtn.innerText;
            submitBtn.innerText = "Memeriksa...";
            submitBtn.disabled = true;

            const payload = {
                action: "login",
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value.trim()
            };

            try {
                const response = await fetch(urlAPI, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if (result.status === "success") {
                    // Menyimpan role yang didapat langsung dari database Google Sheets
                    localStorage.setItem('userRole', result.role);
                    window.location.href = 'index.html';
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert("Terjadi kesalahan jaringan saat mencoba login.");
            } finally {
                submitBtn.innerText = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>

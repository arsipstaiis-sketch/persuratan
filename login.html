<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sistem Penomoran STAIIS</title>
    
    <!-- Font Modern dari Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Memanggil CSS khusus Login -->
    <link rel="stylesheet" href="login.css">  
</head>
<body>

    <!-- Latar belakang aksen melengkung di kanan atas -->
    <div class="bg-accent-top-right"></div>

    <div class="login-wrapper">
        
        <!-- Panel Kiri (Hijau) -->
        <div class="login-left">
            <h1 class="login-title">Layanan<br>Administrasi<br>Persuratan</h1>
            
            <p class="login-desc">
                Aplikasi generate nomor surat resmi dan arsip dokumen persuratan digital.
            </p>
            
            <!-- Tombol Verifikasi Publik -->
            <div class="verifikasi-link-container">
                <a href="verifikasi.html" class="btn-verifikasi-login">
                    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                        <polyline points="22 4 12 14.01 9 11.01"></polyline>
                    </svg>
                    Portal Verifikasi Surat
                </a>
            </div>
        </div>

        <!-- Panel Kanan (Formulir) -->
        <div class="login-right">
            <!-- Logo Instansi -->
            <div class="logo-container">
                <img src="logo.png" alt="Logo STAIIS" class="login-logo">
            </div>

            <form id="formLogin">
                <div class="form-group">
                    <input type="text" id="username" class="form-control" placeholder="Username" required>
                </div>
                
                <div class="form-group password-group">
                    <input type="password" id="password" class="form-control" placeholder="Password" required>
                    <span class="eye-icon" onclick="togglePassword()">
                        <i class="bi bi-eye-slash" id="eyeIcon"></i>
                    </span>
                </div>

                <button type="submit" class="btn-login-submit" id="btnLogin">LOGIN APLIKASI</button>
            </form>

            <div class="login-footer">
                <span>APLIKASI: <strong>PENOMORAN STAIIS v1.0</strong></span>
                <span> &copy; 2026 arsip.staiis</span>
            </div>
        </div>
    </div>

    <!-- Elemen penampung Notifikasi Modern -->
    <div id="modernToast" class="modern-toast"></div>
    <script src="login.js?v=1.0"></script>
    </body>
</html>

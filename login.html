<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Sistem Penomoran STAIIS</title>
    
    <!-- Font Modern dari Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Memanggil CSS khusus Login -->
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- Latar belakang aksen melengkung di kanan atas -->
    <div class="bg-accent-top-right"></div>

    <div class="login-wrapper">
        <!-- Panel Kiri (Hijau) -->
        <div class="login-left">
            <h1 class="login-title">Layanan<br>Administrasi<br>Persuratan</h1>
            
            <p class="login-desc">
                Aplikasi generate nomor surat resmi dan arsip dokumen persuratan digital.
            </p>
        </div>

        <!-- Panel Kanan (Formulir) -->
        <div class="login-right">
            <!-- Logo Instansi -->
            <div class="logo-container">
                <img src="logo.png" alt="Logo STAIIS" class="login-logo">
            </div>

            <form id="formLogin">
                <div class="form-group">
                    <input type="text" id="username" class="form-control" placeholder="Username" required>
                </div>
                
                <div class="form-group password-group">
                    <input type="password" id="password" class="form-control" placeholder="Password" required>
                    <span class="eye-icon" onclick="togglePassword()">
                        <i class="bi bi-eye-slash" id="eyeIcon"></i>
                    </span>
                </div>

                <button type="submit" class="btn-login-submit">LOGIN APLIKASI</button>
            </form>

            <div class="login-footer">
                <span>APLIKASI: <strong>PENOMORAN STAIIS v1.0</strong></span>
                <span><strong>copyright arsip.staiis_2026</strong></span>
            </div>
        </div>
    </div>

    <script>
        // Fitur Lihat Password
        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                eyeIcon.classList.replace("bi-eye-slash", "bi-eye");
            } else {
                pwdInput.type = "password";
                eyeIcon.classList.replace("bi-eye", "bi-eye-slash");
            }
        }

        // Simulasi Login Role (Admin/Pengguna)
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            const uname = document.getElementById('username').value.toLowerCase();
            const pass = document.getElementById('password').value;
            
            if (uname === 'admin' && pass === 'admin123') {
                localStorage.setItem('userRole', 'admin');
                window.location.href = 'index.html'; 
            } else if (uname === 'user' && pass === 'user123') {
                localStorage.setItem('userRole', 'pengguna');
                window.location.href = 'index.html'; 
            } else {
                alert('Username atau Password salah!');
            }
        });
    </script>
</body>
</html>
